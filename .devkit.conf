# devkit policy for platen. Mechanism lives in .tools/devkit (gitignored,
# alongside .tools/simgrep and .tools/zigmap):  scripts/setup-tools
#
# main/dev model: day-to-day work on dev; main moves only through
# `devkit release X.Y.Z` (or `devkit promote`). platen has no dependencies,
# so there is nothing to pin; the manifest still owns the version, which
# build.zig passes to src/version.zig.
HOST=https://git.urverk.org/urverk
DEPS=""
TEST_CMD="zig build test"

# Forge releases. ONE token for every urverk repo (a Forgejo token is an
# account credential scoped write:repository) - same env var / keychain
# service as quote and comb.
FORGE_API=https://git.urverk.org/api/v1/repos/urverk/platen
TOKEN_ENV=URVERK_TOKEN
TOKEN_KEYCHAIN=urverk-token
