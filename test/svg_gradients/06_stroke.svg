<svg xmlns="http://www.w3.org/2000/svg" width="300" height="100">
  <!-- gradient strokes: the box is the fill geometry's (stroke width
       left out), so the gradient runs past it under a wide stroke -->
  <!-- probes: 20,50 50,20 50,80 80,50 85,15 160,20 200,50 240,80 270,30 290,30 -->
  <defs>
    <linearGradient id="g"><stop offset="0" stop-color="red"/><stop offset="1" stop-color="blue"/></linearGradient>
    <linearGradient id="d" x2="1" y2="1"><stop offset="0" stop-color="#0a0"/><stop offset="1" stop-color="#fd0"/></linearGradient>
  </defs>
  <rect x="20" y="20" width="60" height="60" fill="none" stroke="url(#g)" stroke-width="20"/>
  <line x1="150" y1="10" x2="250" y2="90" stroke="url(#d)" stroke-width="16"/>
  <polyline points="260,10 300,50" fill="none" stroke="url(#g)" stroke-width="30"/>
</svg>
