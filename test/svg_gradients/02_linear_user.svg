<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="0 0 100 50">
  <!-- userSpaceOnUse: one gradient runs on across both rects; percentages
       are of the viewBox (100 x 50), which is scaled 2x -->
  <!-- probes: 10,20 70,20 130,20 190,20 20,80 100,80 180,80 -->
  <defs>
    <linearGradient id="abs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="0">
      <stop offset="0" stop-color="black"/><stop offset="1" stop-color="white"/>
    </linearGradient>
    <linearGradient id="pct" gradientUnits="userSpaceOnUse" x1="10%" y1="0" x2="90%" y2="0">
      <stop offset="0" stop-color="#c00"/><stop offset="1" stop-color="#0cc"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="45" height="20" fill="url(#abs)"/>
  <rect x="55" y="0" width="45" height="20" fill="url(#abs)"/>
  <rect x="0" y="30" width="100" height="20" fill="url(#pct)"/>
</svg>
