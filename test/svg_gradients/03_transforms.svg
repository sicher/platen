<svg xmlns="http://www.w3.org/2000/svg" width="300" height="100">
  <!-- gradientTransform in bbox units, a group transform with
       userSpaceOnUse, and inherited fill (each rect its own box) -->
  <!-- probes: 10,10 50,50 90,90 90,10 125,30 170,30 215,30 125,70 145,70 160,70 185,70 220,90 260,20 280,80 -->
  <defs>
    <linearGradient id="rot" gradientTransform="rotate(45)">
      <stop offset="0" stop-color="red"/><stop offset="1" stop-color="blue"/>
    </linearGradient>
    <linearGradient id="user" gradientUnits="userSpaceOnUse" x1="0" x2="50" gradientTransform="translate(5 0)">
      <stop offset="0" stop-color="#f80"/><stop offset="1" stop-color="#08f"/>
    </linearGradient>
    <linearGradient id="g"><stop offset="0" stop-color="white"/><stop offset="1" stop-color="purple"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="100" height="100" fill="url(#rot)"/>
  <g transform="translate(110 20) scale(2 1)">
    <rect x="0" y="0" width="55" height="20" fill="url(#user)"/>
  </g>
  <g fill="url(#g)">
    <rect x="110" y="60" width="40" height="20"/>
    <rect x="155" y="60" width="40" height="20"/>
  </g>
  <rect x="210" y="10" width="80" height="80" fill="url(#g)" transform="rotate(10 250 50)"/>
</svg>
