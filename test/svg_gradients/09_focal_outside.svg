<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100">
  <!-- a focal point outside the circle draws a cone (SVG 2, as PDF's
       radial shading does) and leaves the rest unpainted; on the circle,
       the far half-plane stays unpainted -->
  <!-- probes: 10,50 60,30 30,8 60,92 120,50 150,50 190,8 190,92 -->
  <defs>
    <radialGradient id="out" fx="0.95" fy="0.5" r="0.3"><stop offset="0" stop-color="yellow"/><stop offset="1" stop-color="#a00"/></radialGradient>
    <radialGradient id="edge" fx="0.8" fy="0.5" r="0.3"><stop offset="0" stop-color="yellow"/><stop offset="1" stop-color="#a00"/></radialGradient>
  </defs>
  <rect width="100" height="100" fill="url(#out)"/>
  <rect x="100" width="100" height="100" fill="url(#edge)"/>
</svg>
