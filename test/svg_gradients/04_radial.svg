<svg xmlns="http://www.w3.org/2000/svg" width="300" height="100">
  <!-- radial: default, off-center focal point, userSpaceOnUse, and a
       wide box (the circle becomes an ellipse) -->
  <!-- probes: 50,50 20,50 50,90 5,5 140,40 110,60 130,90 160,80 250,50 220,50 250,20 290,50 210,10 -->
  <defs>
    <radialGradient id="def"><stop offset="0" stop-color="white"/><stop offset="1" stop-color="green"/></radialGradient>
    <radialGradient id="focal" fx="0.25" fy="0.3" r="0.6"><stop offset="0" stop-color="#ff0"/><stop offset="1" stop-color="#a00"/></radialGradient>
    <radialGradient id="user" gradientUnits="userSpaceOnUse" cx="250" cy="50" r="40"><stop offset="0" stop-color="#00f"/><stop offset="1" stop-color="#fff"/></radialGradient>
  </defs>
  <rect x="0" y="0" width="100" height="100" fill="url(#def)"/>
  <rect x="100" y="0" width="100" height="100" fill="url(#focal)"/>
  <rect x="200" y="0" width="100" height="100" fill="url(#user)"/>
</svg>
